<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#fffcfb" />

    <title>Page Not Found | Totestry</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ink: #302438;
        --plum: #3e2d45;
        --mauve: #8b6c9c;
        --paper: #fffcfb;
        --muted: #776c7a;
        --line: #e9e1e7;
        --display: "Bodoni Moda", Georgia, serif;
        --body: "Plus Jakarta Sans", Arial, Helvetica, sans-serif;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #7a5a86;
        outline-offset: 4px;
      }

      .page {
        display: flex;
        flex-direction: column;
        width: min(100%, 1580px);
        min-height: 100vh;
        min-height: 100svh;
        margin-inline: auto;
        padding: 0 24px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 82px;
        padding-inline: clamp(0px, 3vw, 50px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.13em;
      }

      .brand .mark {
        color: #987996;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 0;
        transition: transform 0.7s var(--ease);
      }

      .brand:hover .mark {
        transform: rotate(60deg);
      }

      .brand .dot {
        margin-left: -4px;
        color: #ba887e;
      }

      .header-note {
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .card {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        padding: clamp(45px, 7vw, 110px) clamp(27px, 7vw, 110px);
        border-radius: 28px;
        background: linear-gradient(115deg, #e9dce9, #f1dfe2 58%, #f6e5d5);
      }

      .error-code {
        position: absolute;
        right: 4vw;
        bottom: -0.2em;
        margin: 0;
        color: rgba(129, 97, 131, 0.13);
        font: 500 clamp(200px, 30vw, 460px) / 1 var(--display);
        letter-spacing: -0.06em;
        pointer-events: none;
        animation: drift 9s ease-in-out infinite alternate;
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .content > * {
        animation: enter 0.85s var(--ease) both;
      }

      .content > *:nth-child(2) {
        animation-delay: 0.1s;
      }

      .content > *:nth-child(3) {
        animation-delay: 0.18s;
      }

      .content > *:nth-child(4) {
        animation-delay: 0.26s;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: #8c6b8d;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #6b4f72;
        box-shadow: 0 0 0 4px rgba(139, 108, 156, 0.2);
      }

      h1 {
        max-width: 900px;
        margin: 22px 0 0;
        font: 500 clamp(54px, 7.5vw, 112px) / 1 var(--display);
        letter-spacing: -0.06em;
      }

      h1 em {
        font-style: italic;
        font-weight: 400;
        color: #765476;
      }

      .description {
        max-width: 460px;
        margin: 24px 0 32px;
        color: #5e526c;
        font-size: 16px;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        min-height: 55px;
        padding: 0 24px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      }

      .button:hover {
        transform: translateY(-3px);
      }

      .button svg {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        transition: transform 0.25s var(--ease);
      }

      .button:hover svg {
        transform: translate(3px, -3px);
      }

      .button-dark {
        background: var(--plum);
        color: #fff;
        box-shadow: 0 10px 25px rgba(75, 48, 80, 0.2);
      }

      .button-dark:hover {
        background: #694d6d;
      }

      .button-outline {
        border: 1px solid #77627b;
        background: rgba(255, 255, 255, 0.15);
      }

      .button-outline:hover {
        background: rgba(255, 255, 255, 0.6);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 24px;
        padding: 22px clamp(0px, 3vw, 50px) 26px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .footer a {
        border-bottom: 1px solid #b79ab5;
        color: var(--ink);
        padding-bottom: 3px;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes drift {
        to {
          transform: translate(-2%, -3%);
        }
      }

      @media (max-width: 650px) {
        .page {
          padding: 0 10px;
        }

        .header {
          min-height: 64px;
          padding-inline: 8px;
        }

        .brand {
          font-size: 17px;
        }

        .brand .mark {
          font-size: 24px;
        }

        .header-note {
          display: none;
        }

        .card {
          border-radius: 20px;
        }

        .description {
          font-size: 15px;
        }

        .footer {
          padding-inline: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <header class="header">
        <a class="brand" href="/" aria-label="Totestry home">
          <span class="mark" aria-hidden="true">✳</span>TOTESTRY<span
            class="dot"
            aria-hidden="true"
            >.</span
          >
        </a>

        <span class="header-note">Carry your own story</span>
      </header>

      <div class="card">
        <p class="error-code" aria-hidden="true">404</p>

        <section class="content" aria-labelledby="page-title">
          <p class="eyebrow">404 / Page not found</p>

          <h1 id="page-title">
            Let’s get you<br /><em>back on track.</em>
          </h1>

          <p class="description">
            The page you’re looking for doesn’t exist or may have moved.
            Return home or explore the Totestry collection.
          </p>

          <div class="actions">
            <a class="button button-dark" href="/">
              Back to home
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 17 17 7M7 7h10v10" />
              </svg>
            </a>

            <a class="button button-outline" href="/shop">Explore bags</a>
          </div>
        </section>
      </div>

      <footer class="footer">
        <span>Totestry. All rights reserved.</span>
        <a href="/contact">Contact our team</a>
      </footer>
    </main>
  </body>
</html>
